<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Show Activation</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }

        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .info-box {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 25px;
            border: 1px solid #333333;
        }

        .key-label {
            color: #aaaaaa;
        }

        .key-value {
            color: #00ffcc;
            font-weight: bold;
            margin-left: 10px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }

        /* تعديل هنا: منع إظهار مؤشر الكتابة عند الضغط على الحقل */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            user-select: none;
        }

        .btn-copy {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-copy:hover {
            background-color: #e6b800;
        }

        .btn-copy:focus {
            outline: 2px solid #00ffcc; /* إطار واضح عند وقوف ريموت التلفاز عليه */
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background-color: #00ffcc;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DRAGON SHOW</h1>

        <div class="info-box">
            <span class="key-label">Device Key:</span>
            <span class="key-value">DK-9842-X77</span>
        </div>

        <div class="input-group">
            <label for="activeCode">Active Code</label>
            <!-- أضفنا readonly لمنع ظهور الكيبورد نهائياً عند النقر -->
            <input type="text" id="activeCode" value="http://jokerip.com:80/get.php?username=98:06:3c:07:4f:cc&password=TZXdthHCZp&type=m3u_plus&output=ts" readonly>
        </div>

        <button class="btn-copy" onclick="copyCode()">Copy Code</button>
    </div>

    <div id="toast" class="toast">Code copied successfully!</div>

    <script>
        // دالة النسخ المتوافقة مع شاشات التلفاز والموبايل بدون إظهار كيبورد
        function copyCode() {
            var copyText = document.getElementById("activeCode");
            
            // إنشاء عنصر نصي مؤقت ومخفي لإتمام عملية النسخ في النظام
            var tempInput = document.createElement("input");
            tempInput.value = copyText.value;
            document.body.appendChild(tempInput);
            
            // تحديد النص ونسخه برمجياً دون تحفيز الكيبورد
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            
            // حذف العنصر المؤقت فوراً بعد النسخ
            document.body.removeChild(tempInput);

            // إظهار رسالة التأكيد
            var toast = document.getElementById("toast");
            toast.style.display = "block";
            setTimeout(function(){ 
                toast.style.display = "none"; 
            }, 2000);
        }
    </script>

</body>
</html>
