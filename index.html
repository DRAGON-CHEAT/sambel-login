<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Show Activation Test</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 6px;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            user-select: none;
        }
        #macAddressField, #activeCode {
            color: #00ffcc;
            font-weight: bold;
        }
        .btn-copy {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-copy:hover {
            background-color: #e6b800;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            background-color: #00ffcc;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "drag-9user",
            storageBucket: "drag-9user.firebasestorage.app",
            messagingSenderId: "716759119906",
            appId: "1:716759119906:web:4b522ed58dba7bf623727b"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        let isSavedToFirebase = false;

        window.initAndroidDeviceData = function() {
            // فحص الاتصال بالجسر
            if (typeof AndroidBridge !== "undefined" && typeof AndroidBridge.getMacAddress === "function") {
                let macAddress = AndroidBridge.getMacAddress();

                if (macAddress && macAddress.trim() !== "") {
                    macAddress = macAddress.trim().toUpperCase();
                    
                    // حقن الماك التجريبي الثابت داخل الحقل على موقعك للتحقق
                    document.getElementById("macAddressField").value = macAddress;
                    
                    // تحديث حقل الـ Active Code بالرابط الجديد
                    const finalUrl = `http://jokerip.com{macAddress}&password=TZXdthHCZp&type=m3u_plus&output=ts`;
                    document.getElementById("activeCode").value = finalUrl;

                    if (!isSavedToFirebase) {
                        isSavedToFirebase = true;
                        const safeMacKey = macAddress.replace(/:/g, "");

                        set(ref(database, 'registered_devices/' + safeMacKey), {
                            mac: macAddress,
                            active_code: finalUrl,
                            registeredAt: new Date().toISOString(),
                            status: "test_active"
                        });
                    }
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setInterval(window.initAndroidDeviceData, 500);
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>DRAGON SHOW</h1>

        <div class="input-group">
            <label for="macAddressField">MAC Address</label>
            <input type="text" id="macAddressField" value="Waiting for Android Bridge..." readonly>
        </div>

        <div class="input-group">
            <label for="activeCode">Active Code</label>
            <input type="text" id="activeCode" value="Generating Test Link..." readonly>
        </div>

        <button class="btn-copy" onclick="copyCode()">Copy Code</button>
    </div>

    <div id="toast" class="toast">Code copied successfully!</div>

    <script>
        function copyCode() {
            var copyText = document.getElementById("activeCode");
            if(copyText.value.includes("Generating")) return;

            var tempInput = document.createElement("input");
            tempInput.value = copyText.value;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            var toast = document.getElementById("toast");
            toast.style.display = "block";
            setTimeout(function(){ toast.style.display = "none"; }, 2000);
        }
    </script>

</body>
</html>
