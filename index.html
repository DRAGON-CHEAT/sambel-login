<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dragon Show</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 14px;
            padding: 30px;

            box-shadow:
                0 5px 25px
                rgba(255,255,255,0.05);

            text-align: center;
        }

        h1 {
            margin: 0 0 28px 0;
            color: #ffcc00;
            font-size: 2.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 10px 14px;
            border-radius: 7px;
            border: 1px solid #444;
            outline: none;
            background: #222;
            color: #00ffcc;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            user-select: none;
        }

        #actionBtn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 7px;
            background: #ffcc00;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #actionBtn:active {
            transform: scale(0.98);
        }

        #actionBtn.copy-mode {
            background: #00ffcc;
            color: #000;
        }

        #status {
            margin-top: 18px;
            min-height: 22px;
            color: #aaa;
            font-size: 13px;
        }

        .success {
            color: #00ffcc !important;
        }

        .error {
            color: #ff5555 !important;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>DRAGON SHOW</h1>

    <!-- Device Key -->

    <div class="input-group">

        <label for="deviceKeyField">
            Device Key
        </label>

        <input
            type="text"
            id="deviceKeyField"
            value="xxxxxxx"
            readonly
        >

    </div>


    <!-- Active Code -->

    <div class="input-group">

        <label for="activeCodeField">
            Active Code
        </label>

        <input
            type="text"
            id="activeCodeField"
            value="Waiting ActiveCode"
            readonly
        >

    </div>


    <!-- Active / Copy -->

    <button
        id="actionBtn"
        onclick="handleActive()"
    >
        Active
    </button>


    <div id="status">
        Connecting..
    </div>

</div>


<script>

/*
|--------------------------------------------------------------------------
| Firebase
|--------------------------------------------------------------------------
*/

const firebaseConfig = {

    apiKey:
        "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",

    authDomain:
        "drag-9user.firebaseapp.com",

    databaseURL:
        "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "drag-9user",

    storageBucket:
        "drag-9user.firebasestorage.app",

    messagingSenderId:
        "716759119906",

    appId:
        "1:716759119906:web:4b522ed58dba7bf623727b"
};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();


/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const deviceKeyField =
    document.getElementById(
        "deviceKeyField"
    );

const activeCodeField =
    document.getElementById(
        "activeCodeField"
    );

const actionBtn =
    document.getElementById(
        "actionBtn"
    );

const status =
    document.getElementById(
        "status"
    );

let realActiveCode = "";
/*
|--------------------------------------------------------------------------
| Local Storage Keys
|--------------------------------------------------------------------------
*/

const LOCAL_KEY =
    "dragon_device_key";

const LOCAL_DEVICE_ID =
    "dragon_device_id";


/*
|--------------------------------------------------------------------------
| Generate Device ID
|--------------------------------------------------------------------------
|
| مثال:
|
| 58317426
|
| 8 أرقام فقط
| بدون -
|
*/

function generateRandomID() {

    return String(
        Math.floor(
            10000000 +
            Math.random() * 90000000
        )
    );
}


/*
|--------------------------------------------------------------------------
| Get Device ID
|--------------------------------------------------------------------------
|
| نفس المتصفح يحتفظ بنفس Device ID
|
*/

function getDeviceId() {

    let id =
        localStorage.getItem(
            LOCAL_DEVICE_ID
        );

    if (!id) {

        id =
            generateRandomID();

        localStorage.setItem(
            LOCAL_DEVICE_ID,
            id
        );
    }

    return id;
}


const deviceId =
    getDeviceId();


/*
|--------------------------------------------------------------------------
| Find Free Key
|--------------------------------------------------------------------------
|
| يبحث:
|
| key1
| key2
| key3
| key4
| ...
|
| ويأخذ أول واحد غير موجود.
|
*/

async function findFreeKey() {

    let number = 1;

    while (true) {

        const key =
            "key" + number;

        const snapshot =
            await db
                .ref(
                    "devices/" + key
                )
                .once("value");

        if (!snapshot.exists()) {

            return key;
        }

        number++;
    }
}


/*
|--------------------------------------------------------------------------
| Get Or Create Device Key
|--------------------------------------------------------------------------
*/

async function getOrCreateDeviceKey() {

    /*
     * إذا المتصفح عنده key محفوظ
     * نستخدمه مباشرة
     */

    const savedKey =
        localStorage.getItem(
            LOCAL_KEY
        );

    if (savedKey) {

        /*
         * نتأكد أن المسار موجود
         */

        const snapshot =
            await db
                .ref(
                    "devices/" + savedKey
                )
                .once("value");

        if (snapshot.exists()) {

            return savedKey;
        }

        /*
         * إذا انحذف من Firebase
         * نحذف النسخة المحلية
         */

        localStorage.removeItem(
            LOCAL_KEY
        );
    }


    /*
     * ابحث عن أول key جديد
     */

    const newKey =
        await findFreeKey();


    /*
     * أنشئ البيانات
     */

    await db
        .ref(
            "devices/" + newKey
        )
        .set({

            currentDevice:
                deviceId,

            active_code:
                ""

        });


    /*
     * احفظ key لهذا المتصفح
     */

    localStorage.setItem(
        LOCAL_KEY,
        newKey
    );


    return newKey;
}


/*
|--------------------------------------------------------------------------
| Current Device Key
|--------------------------------------------------------------------------
*/

let currentDeviceKey =
    null;


/*
|--------------------------------------------------------------------------
| Listen To Device
|--------------------------------------------------------------------------
*/

function listenToDevice() {

    if (!currentDeviceKey) {
        return;
    }


    const devicePath =
        "devices/" +
        currentDeviceKey;


    db.ref(devicePath).on(
        "value",

        function(snapshot) {

            const data =
                snapshot.val();


            /*
             * إذا تم حذف الجهاز من Firebase
             */

            if (!data) {

                deviceKeyField.value =
                    "Device Removed";

                activeCodeField.value =
                    "Waiting for Active";

                actionBtn.innerText =
                    "Active";

                actionBtn.classList.remove(
                    "copy-mode"
                );

                status.innerText =
                    "Device data not found";

                status.className =
                    "error";

                return;
            }


            /*
             * Device Key
             */

            deviceKeyField.value =
    String(
        data.currentDevice ||
        "xxxxxxx"
    );


          /*
 * Active Code
 */

if (
    data.active_code !== undefined &&
    data.active_code !== null &&
    String(data.active_code).trim() !== ""
) {

    /*
     * حفظ الكود الحقيقي داخليًا
     * وعدم إظهاره للمستخدم
     */

    realActiveCode =
        String(data.active_code);

    /*
     * إظهار نجوم فقط
     */

    activeCodeField.value =
        "********";

    /*
     * صار عندنا Active Code
     */

    actionBtn.innerText =
        "Copy Code";

    actionBtn.classList.add(
        "copy-mode"
    );

    status.innerText =
        " ";

    status.className =
        "success";

} else {

    realActiveCode = "";

    activeCodeField.value =
        "Waiting for Active";

    actionBtn.innerText =
        "Active";

    actionBtn.classList.remove(
        "copy-mode"
    );

    status.innerText =
        "Click Button To Active ";

    status.className =
        "";
}
        },

        function(error) {

            console.error(
                "Firebase read error:",
                error
            );

            status.innerText =
                "Firebase error: " +
                error.message;

            status.className =
                "error";
        }
    );
}


/*
|--------------------------------------------------------------------------
| Active Button
|--------------------------------------------------------------------------
*/

async function handleActive() {

    /*
     * إذا صار Copy Code
     */

    if (
        actionBtn.classList.contains(
            "copy-mode"
        )
    ) {

        copyActiveCode();

        return;
    }


    /*
     * إذا ما عندنا key
     */

    if (!currentDeviceKey) {

        status.innerText =
            " key is not ready";

        status.className =
            "error";

        return;
    }


    /*
     * قراءة بيانات الجهاز
     */

    const devicePath =
        "devices/" +
        currentDeviceKey;


    try {

        const snapshot =
            await db
                .ref(devicePath)
                .once("value");


        const data =
            snapshot.val() || {};


        /*
         * إذا currentDevice غير موجود
         */

        if (
            !data.currentDevice
        ) {

            await db
                .ref(devicePath)
                .update({

                    currentDevice:
                        deviceId

                });
        }


        status.innerText =
            "Please Scan QR  To Activate";

        status.className =
            "success";

    } catch (error) {

        console.error(
            "Firebase write error:",
            error
        );

        status.innerText =
            "Firebase error: " +
            error.message;

        status.className =
            "error";
    }
}


/*
|--------------------------------------------------------------------------
| Copy Active Code
|--------------------------------------------------------------------------
*/

function copyActiveCode() {

    const code =
    realActiveCode;


    /*
     * لا يوجد كود
     */

    if (
        !code ||
        code === "Waiting for Active"
    ) {

        status.innerText =
            " Wait Active Code ";

        status.className =
            "error";

        return;
    }


    /*
     * Clipboard API
     */

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(code)

            .then(function() {

                /*
                 * رسالة عند الضغط على Copy
                 */

                status.innerText =
                    "✓ Active Code  Successfully";

                status.className =
                    "success";

            })

            .catch(function() {

                fallbackCopy(code);

            });

    } else {

        fallbackCopy(code);

    }
}


/*
|--------------------------------------------------------------------------
| Fallback Copy
|--------------------------------------------------------------------------
*/

function fallbackCopy(text) {

    const input =
        document.createElement(
            "textarea"
        );


    input.value =
        text;


    input.style.position =
        "fixed";


    input.style.left =
        "-9999px";


    document.body.appendChild(
        input
    );


    input.focus();

    input.select();


    try {

        const successful =
            document.execCommand(
                "copy"
            );


        if (successful) {

            status.innerText =
                "✓ Now Go To add Pleylist M3u ";

            status.className =
                "success";

        } else {

            status.innerText =
                "Copy failed";

            status.className =
                "error";
        }

    } catch (error) {

        status.innerText =
            "Copy failed";

        status.className =
            "error";
    }


    document.body.removeChild(
        input
    );
}


/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "DOMContentLoaded",

    async function() {

        try {

            status.innerText =
                " ";


            /*
             * الحصول على key
             */

            currentDeviceKey =
                await getOrCreateDeviceKey();


        /*
 * إظهار Device ID
 */

deviceKeyField.value =
    "xxxxxxx";


            /*
             * تشغيل الاستماع
             */

            listenToDevice();


            status.innerText =
                "";

            status.className =
                "success";

        } catch (error) {

            console.error(
                "Device initialization error:",
                error
            );

            status.innerText =
                "Initialization error: " +
                error.message;

            status.className =
                "error";
        }

    });

</script>

</body>
</html>
