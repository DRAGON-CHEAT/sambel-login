<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Show Activation</title>
    <!-- تضمين مكتبات الفايربيس المتوافقة مع كودك -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            user-select: none;
        }
        #deviceIdField, #activeCode {
            color: #00ffcc;
            font-weight: bold;
        }
        .btn-copy {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            background-color: #00ffcc;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DRAGON SHOW</h1>

        <div class="input-group">
            <label for="deviceIdField">Device Key (ID)</label>
            <input type="text" id="deviceIdField" value="" readonly>
        </div>

        <div class="input-group">
            <label for="activeCode">Active Code</label>
            <input type="text" id="activeCode" value="" readonly>
        </div>

        <button class="btn-copy" onclick="copyCode()">Copy Code</button>
    </div>

    <div id="toast" class="toast">Code copied successfully!</div>

    <script>
        // إعدادات الفايربيس الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app",
            projectId: "drag-9user",
            storageBucket: "drag-9user.firebasestorage.app",
            messagingSenderId: "716759119906",
            appId: "1:716759119906:web:4b522ed58dba7bf623727b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // دالة توليد المعرف الجديد (أحرف وأرقام صغيرة عشوائية) متناسق مع طلبك تماماً
        function generateRandomID() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                // توليد سلسلة عشوائية من الأحرف والأرقام بطول 13 رمزاً
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let randomSegment = '';
                for (let i = 0; i < 13; i++) {
                    randomSegment += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                // دمجها لتصبح بالصيغة المطلوبة: id-xxxxxxxxxxxxx
                id = "id-" + randomSegment;
                localStorage.setItem('deviceId', id);
            }
            return id;
        }
        
        const deviceId = generateRandomID();

        function initAppLayout() {
            // عرض الـ Device Key الجديد في خانة النص
            document.getElementById("deviceIdField").value = deviceId;
            
            // توليد كود التفعيل بالمعرف الجديد
            const finalUrl = `http://jokerip.com{deviceId}&password=TZXdthHCZp&type=m3u_plus&output=ts`;
            document.getElementById("activeCode").value = finalUrl;

            // اسم المستخدم الثابت والدائم لكل الأجهزة بناءً على طلبك
            const targetUser = "tv vip";

            // حقن البيانات في الفايربيس تحت مسار users/tv vip مباشرة
            db.ref("users/" + targetUser).set({
                currentDevice: deviceId,
                expirydate: "",
                password: "s201319", // الباسورد الافتراضي للحساب الثابت
                username: targetUser,
                active_code: finalUrl
            }).then(() => {
                console.log("Database successfully updated under fixed user 'tv vip'");
            }).catch((error) => {
                console.error("Firebase database error: ", error);
            });
        }

        window.addEventListener('DOMContentLoaded', initAppLayout);

        function copyCode() {
            var copyText = document.getElementById("activeCode");
            var tempInput = document.createElement("input");
            tempInput.value = copyText.value;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            var toast = document.getElementById("toast");
            toast.style.display = "block";
            setTimeout(function(){ toast.style.display = "none"; }, 2000);
        }
    </script>

</body>
</html>
