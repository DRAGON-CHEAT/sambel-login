<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dragon Show</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

html,
body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #222;
    color: #fff;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}


/* =========================================================
   RGB SIDE LIGHT
   ========================================================= */

body::before,
body::after {
    content: "";
    position: fixed;
    top: 0;
    bottom: 0;
    width: 28vw;
    max-width: 260px;
    pointer-events: none;
    z-index: 0;
}

body::before {
    left: 0;

    background: linear-gradient(
        to right,
        rgba(255, 0, 80, 0.32),
        rgba(0, 180, 255, 0.16) 40%,
        transparent 100%
    );
}

body::after {
    right: 0;

    background: linear-gradient(
        to left,
        rgba(0, 255, 180, 0.32),
        rgba(140, 0, 255, 0.16) 40%,
        transparent 100%
    );
}


/* =========================================================
   TOP IMAGES
   ========================================================= */

.top-slots {
    display: flex;
    gap: 14px;
    width: 100%;
    
    margin: 0 0 28px 0;
}

.top-slot {
    flex: 1;
    min-width: 0;

    aspect-ratio: 1 / 0.83;

    border-radius: clamp(
        7px,
        0.7vw,
        12px
    );

    background: #222;
    border: 1px solid #444;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    text-decoration: none;
}

.top-slot img {
    width: 100%;
    height: 100%;

    object-fit: fill;
    display: block;
}


/* =========================================================
   INPUT GROUP
   ========================================================= */

.input-group {
    margin-bottom: 20px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 8px;

    color: #ccc;
    font-size: 15px;
    font-weight: 600;
}


/* =========================================================
   INPUT
   ========================================================= */

input {
    width: 100%;
    height: 50px;

    padding: 10px 14px;

    border-radius: 7px;
    border: 1px solid #444;
    outline: none;

    background: #7d2c574d;
    color: #00ffcc;

    font-size: 17px;
    font-weight: bold;

    text-align: center;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================================
   ACTIVE CODE
   ========================================================= */

.active-code-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
}

#activeCodeField {
    width: 100%;
    height: 50px;

    padding: 10px 14px;

    text-align: center;
}

#activeTimer {
    position: absolute;

    left: 12px;
    top: 50%;

    transform: translateY(-50%);

    width: 45px;

    color: #ffcc00;

    font-size: 12px;
    font-weight: bold;

    text-align: center;

    pointer-events: none;
    z-index: 2;
}

#activeTimer.hidden {
    display: none;
}


/* =========================================================
   BUTTON
   ========================================================= */

#actionBtn {
    width: 100%;
    height: 52px;

    margin-top: 0;

    border: none;
    border-radius: 7px;

    background: #ffcc00;
    color: #000;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s;
}

#actionBtn:active {
    transform: scale(0.98);
}

#actionBtn.copy-mode {
    background: #00ffcc;
    color: #000;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
    margin-top: 18px;

    min-height: 22px;
    width: 100%;

    color: #aaa;

    font-size: 13px;
    text-align: center;
}

.success {
    color: #00ffcc !important;
}

.error {
    color: #ff5555 !important;
}


/* =========================================================
   DRAGON SHOW TITLE
   ========================================================= */

.dragon-title {
    position: absolute;

    top: 26px;
    left: 50%;
    transform: translateX(-50%);

    color: #8f2f4f;

    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;

    line-height: 1;
    text-align: center;
    white-space: nowrap;

    z-index: 10;
}


/* =========================================================
   TV MODE
   ========================================================= */

@media (min-width: 800px) {

    body {
        padding: 2vh 2vw;
    }

    .container {
        width: 70vw;
        max-width: 620px;
        min-width: 380px;
        max-height: 90vh;
        transform: translateY(4px);
    }

    /* Dragon Show في الزاوية اليسرى */
    .dragon-title {
        top: clamp(20px, 3vh, 35px);
        left: clamp(17px, 2vw, 45px);
        transform: none;

        font-size: clamp(
            15px,
            1.6vw,
            26px
        );

        letter-spacing: clamp(
            1.5px,
            0.2vw,
            3px
        );

        text-align: left;
    }

    /* لا نضيف مسافة إضافية للمربعات */
    .top-slots {
        margin-top: 1px;
    }
}


    /* =====================================================
       الصور
       ===================================================== */

    .top-slots {
        width: 100%;

        gap: clamp(
            10px,
            1.2vw,
            18px
        );

        margin-bottom: clamp(
            16px,
            2vh,
            28px
        );
    }

    .top-slot {
        border-radius: clamp(
            7px,
            0.7vw,
            12px
        );
    }


    /* =====================================================
       Input Groups
       ===================================================== */

    .input-group {
        margin-bottom: clamp(
            12px,
            1.6vh,
            22px
        );
    }


    /* =====================================================
       Labels
       ===================================================== */

    label {
        margin-bottom: clamp(
            5px,
            0.7vh,
            9px
        );

        font-size: clamp(
            12px,
            1.1vw,
            17px
        );
    }


    /* =====================================================
       Inputs
       ===================================================== */

    input {
        width: 100%;

        height: clamp(
            40px,
            5vh,
            56px
        );

        padding:
            8px
            clamp(10px, 1vw, 16px);

        border-radius: clamp(
            6px,
            0.5vw,
            9px
        );

        font-size: clamp(
            14px,
            1.25vw,
            19px
        );
    }


    /* =====================================================
       Active Code
       ===================================================== */

    .active-code-wrapper {
        margin-bottom: clamp(
            12px,
            1.6vh,
            22px
        );
    }

    #activeCodeField {
        width: 100%;

        height: clamp(
            40px,
            5vh,
            56px
        );

        padding:
            8px
            clamp(10px, 1vw, 16px);

        font-size: clamp(
            14px,
            1.25vw,
            19px
        );
    }


    /* =====================================================
       Timer
       ===================================================== */

    #activeTimer {
        left: clamp(
            8px,
            1vw,
            14px
        );

        width: clamp(
            38px,
            4vw,
            52px
        );

        font-size: clamp(
            10px,
            0.9vw,
            14px
        );
    }


    /* =====================================================
       Button
       ===================================================== */

    #actionBtn {
        width: 100%;

        height: clamp(
            42px,
            5.2vh,
            58px
        );

        border-radius: clamp(
            6px,
            0.5vw,
            9px
        );

        font-size: clamp(
            14px,
            1.3vw,
            20px
        );
    }

@media (max-width: 799px) {
    .top-slots {
        transform: translateY(-15px);
    }
}
    /* =====================================================
       Status
       ===================================================== */

    #status {
        margin-top: clamp(
            8px,
            1.5vh,
            18px
        );

        min-height: clamp(
            18px,
            2vh,
            25px
        );

        font-size: clamp(
            11px,
            0.9vw,
            14px
        );
    }
}
}
</style>

</head>
