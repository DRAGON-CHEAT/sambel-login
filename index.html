<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Show Activation</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }

        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .info-box {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 25px;
            border: 1px solid #333333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .key-label {
            color: #aaaaaa;
            font-size: 1rem;
        }

        .key-value {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #00ffcc;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            user-select: none;
            font-weight: bold;
        }

        .btn-copy {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-copy:hover {
            background-color: #e6b800;
        }

        .btn-copy:focus {
            outline: 2px solid #00ffcc;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background-color: #00ffcc;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "drag-9user",
            storageBucket: "drag-9user.firebasestorage.app",
            messagingSenderId: "716759119906",
            appId: "1:716759119906:web:4b522ed58dba7bf623727b"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.initAndroidDeviceData = function() {
            if (typeof AndroidBridge !== "undefined" && typeof AndroidBridge.getMacAddress === "function") {
                const macAddress = AndroidBridge.getMacAddress();

                // عرض الماك الحقيقي في الصندوق العلوي
                document.getElementById("macAddressDisplay").innerText = macAddress.toUpperCase();
                
                // إنشاء رابط التفعيل وحقنه داخل حقل النص الإدخالي
                const finalUrl = `http://jokerip.com{macAddress}&password=TZXdthHCZp&type=m3u_plus&output=ts`;
                document.getElementById("activeCode").value = finalUrl;

                const safeMacKey = macAddress.replace(/:/g, "").toUpperCase();

                // حفظ البيانات في الفايربيس تلقائياً
                set(ref(database, 'registered_devices/' + safeMacKey), {
                    mac: macAddress,
                    active_code: finalUrl,
                    registeredAt: new Date().toISOString(),
                    status: "active"
                }).then(() => {
                    console.log("Data loaded and saved to Firebase.");
                }).catch((error) => {
                    console.error("Firebase Error: ", error);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(window.initAndroidDeviceData, 600);
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>DRAGON SHOW</h1>

        <!-- صندوق عرض عنوان الماك المحدث فوق الحقل مباشرة -->
        <div class="info-box">
            <span class="key-label">عنوان ماك</span>
            <span class="key-value" id="macAddressDisplay">00:00:00:00:00:00</span>
        </div>

        <div class="input-group">
            <label for="activeCode">Active Code</label>
            <input type="text" id="activeCode" value="جاري استخراج الرابط..." readonly>
        </div>

        <button class="btn-copy" onclick="copyCode()">Copy Code</button>
    </div>

    <div id="toast" class="toast">Code copied successfully!</div>

    <script>
        function copyCode() {
            var copyText = document.getElementById("activeCode");
            var tempInput = document.createElement("input");
            tempInput.value = copyText.value;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            var toast = document.getElementById("toast");
            toast.style.display = "block";
            setTimeout(function(){ 
                toast.style.display = "none"; 
            }, 2000);
        }
    </script>

</body>
</html>
