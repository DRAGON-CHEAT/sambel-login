<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dragon Show</title>

    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

html,
body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #222;
    color: #fff;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}






body::before,
body::after {
    content: "";
    position: fixed;
    top: 0;
    bottom: 0;
    width: 28vw;
    max-width: 260px;
    pointer-events: none;
    z-index: 0;
}

body::before {
    left: 0;

    background: linear-gradient(
        to right,
        rgba(255, 0, 80, 0.32),
        rgba(0, 180, 255, 0.16) 40%,
        transparent 100%
    );
}

body::after {
    right: 0;

    background: linear-gradient(
        to left,
        rgba(0, 255, 180, 0.32),
        rgba(140, 0, 255, 0.16) 40%,
        transparent 100%
    );
}






.top-slots {
    display: flex;
    gap: 14px;
    width: 100%;
    
    margin: 0 0 28px 0;
}

.top-slot {
    flex: 1;
    min-width: 0;

    aspect-ratio: 1 / 0.83;

    border-radius: clamp(
        7px,
        0.7vw,
        12px
    );

    background: #222;
    border: 1px solid #444;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    text-decoration: none;
}

.top-slot img {
    width: 100%;
    height: 100%;

    object-fit: fill;
    display: block;
}






.input-group {
    margin-bottom: 20px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 8px;

    color: #ccc;
    font-size: 15px;
    font-weight: 600;
}






input {
    width: 100%;
    height: 50px;

    padding: 10px 14px;

    border-radius: 7px;
    border: 1px solid #444;
    outline: none;

    background: #7d2c574d;
    color: #00ffcc;

    font-size: 17px;
    font-weight: bold;

    text-align: center;

    user-select: none;
    -webkit-user-select: none;
}






.active-code-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
}

#activeCodeField {
    width: 100%;
    height: 50px;

    padding: 10px 14px;

    text-align: center;
}

#activeTimer {
    position: absolute;

    left: 12px;
    top: 50%;

    transform: translateY(-50%);

    width: 45px;

    color: #ffcc00;

    font-size: 12px;
    font-weight: bold;

    text-align: center;

    pointer-events: none;
    z-index: 2;
}

#activeTimer.hidden {
    display: none;
}






#actionBtn {
    width: 100%;
    height: 52px;

    margin-top: 0;

    border: none;
    border-radius: 7px;

    background: #ffcc00;
    color: #000;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s;
}

#actionBtn:active {
    transform: scale(0.98);
}

#actionBtn.copy-mode {
    background: #00ffcc;
    color: #000;
}






#status {
    margin-top: 18px;

    min-height: 22px;
    width: 100%;

    color: #aaa;

    font-size: 13px;
    text-align: center;
}

.success {
    color: #00ffcc !important;
}

.error {
    color: #ff5555 !important;
}






.dragon-title {
    position: absolute;

    top: 26px;
    left: 50%;
    transform: translateX(-50%);

    color: #8f2f4f;

    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;

    line-height: 1;
    text-align: center;
    white-space: nowrap;

    z-index: 10;
}






@media (min-width: 800px) {

    body {
        padding: 2vh 2vw;
    }

    .container {
        width: 70vw;
        max-width: 620px;
        min-width: 380px;
        max-height: 90vh;
        transform: translateY(4px);
    }

    
    .dragon-title {
        top: clamp(20px, 3vh, 35px);
        left: clamp(17px, 2vw, 45px);
        transform: none;

        font-size: clamp(
            15px,
            1.6vw,
            26px
        );

        letter-spacing: clamp(
            1.5px,
            0.2vw,
            3px
        );

        text-align: left;
    }

    
    .top-slots {
        margin-top: 1px;
    }
}


    



    .top-slots {
        width: 100%;

        gap: clamp(
            10px,
            1.2vw,
            18px
        );

        margin-bottom: clamp(
            16px,
            2vh,
            28px
        );
    }

    .top-slot {
        border-radius: clamp(
            7px,
            0.7vw,
            12px
        );
    }


    



    .input-group {
        margin-bottom: clamp(
            12px,
            1.6vh,
            22px
        );
    }


    



    label {
        margin-bottom: clamp(
            5px,
            0.7vh,
            9px
        );

        font-size: clamp(
            12px,
            1.1vw,
            17px
        );
    }


    



    input {
        width: 100%;

        height: clamp(
            40px,
            5vh,
            56px
        );

        padding:
            8px
            clamp(10px, 1vw, 16px);

        border-radius: clamp(
            6px,
            0.5vw,
            9px
        );

        font-size: clamp(
            14px,
            1.25vw,
            19px
        );
    }


    



    .active-code-wrapper {
        margin-bottom: clamp(
            12px,
            1.6vh,
            22px
        );
    }

    #activeCodeField {
        width: 100%;

        height: clamp(
            40px,
            5vh,
            56px
        );

        padding:
            8px
            clamp(10px, 1vw, 16px);

        font-size: clamp(
            14px,
            1.25vw,
            19px
        );
    }


    



    #activeTimer {
        left: clamp(
            8px,
            1vw,
            14px
        );

        width: clamp(
            38px,
            4vw,
            52px
        );

        font-size: clamp(
            10px,
            0.9vw,
            14px
        );
    }


    



    #actionBtn {
        width: 100%;

        height: clamp(
            42px,
            5.2vh,
            58px
        );

        border-radius: clamp(
            6px,
            0.5vw,
            9px
        );

        font-size: clamp(
            14px,
            1.3vw,
            20px
        );
    }

@media (max-width: 799px) {
    .top-slots {
        transform: translateY(-15px);
    }
}
    



    #status {
        margin-top: clamp(
            8px,
            1.5vh,
            18px
        );

        min-height: clamp(
            18px,
            2vh,
            25px
        );

        font-size: clamp(
            11px,
            0.9vw,
            14px
        );
    }
}
}
</style>

</head>

<body>
<div class="dragon-title">𝔻ℝ𝔸𝔾𝕆ℕ 𝕊ℍ𝕆𝕎</div>
<div class="container">

    <div class="top-slots">
        <a class="top-slot" href="https://t.me/Dev_DragonCheat" aria-label="QR Code">
            <img src="https://j.top4top.io/p_39276bu470.jpg" alt="QR Code">
        </a>

        <a class="top-slot" href="https://wa.me/qr/DPYQO5UBN27IB1" aria-label="Link">
            <img src="https://k.top4top.io/p_3927tljww2.jpg" alt="Link">
        </a>
    </div>

    

    <div class="input-group">

        <label for="deviceKeyField">
            Device Key
        </label>

        <input
            type="text"
            id="deviceKeyField"
            value="xxxxxxx"
            readonly
        >

    </div>


    
<div class="input-group" style="display: none;">
    <label for="activeCodeField">Active Code</label>
    <div class="active-code-wrapper">
        <span id="activeTimer">00:06</span>
        <input type="text" id="activeCodeField" value="Waiting ActiveCode" readonly>
    </div>
</div>


<div id="progressWrapper" class="input-group" style="display: none; width: 100%;">
    <div style="width: 100%; background-color: #e0e0e0; border-radius: 4px; position: relative; height: 35px; overflow: hidden; margin-top: 5px;">
        <div id="progressBar" style="width: 0%; height: 100%; background-color: #2196F3; transition: width 0.5s ease;"></div>
        <span id="progressText" style="position: absolute; width: 100%; text-align: center; left: 0; top: 0; line-height: 35px; color: #333; font-weight: bold;">Connecting..</span>
    </div>
    
    <div id="qrHelpMessage" style="width: 100%; text-align: center; margin-top: 8px; font-size: 14px; color: #666; font-weight: 500; display: none;">
        To activate your account, please scan the QR code
    </div>
</div>


<button id="actionBtn" onclick="handleActiveClick()">Active Account</button>


<div id="status" style="display: none;">Connecting..</div>



<script>







const firebaseConfig = {

    apiKey:
        "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",

    authDomain:
        "drag-9user.firebaseapp.com",

    databaseURL:
        "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "drag-9user",

    storageBucket:
        "drag-9user.firebasestorage.app",

    messagingSenderId:
        "716759119906",

    appId:
        "1:716759119906:web:4b522ed58dba7bf623727b"
};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();

const deviceKeyField =
    document.getElementById(
        "deviceKeyField"
    );

const activeCodeField =
    document.getElementById(
        "activeCodeField"
    );

const actionBtn =
    document.getElementById(
        "actionBtn"
    );

const status =
    document.getElementById(
        "status"
    );


let realActiveCode = "";

const activeTimer =
    document.getElementById(
        "activeTimer"
    );

let activeTimerInterval = null;

let activeSeconds = 0;







function startActiveTimer() {
    if (!activeTimer) {
        return;
    }

    if (activeTimerInterval) {
        clearInterval(activeTimerInterval);
        activeTimerInterval = null;
    }

    
    activeSeconds = 2;
    activeTimer.innerText = "00:06";
    activeTimer.classList.remove("hidden");

    activeTimerInterval = setInterval(async function() {
        activeSeconds--;

        const minutes = Math.floor(activeSeconds / 60);
        const seconds = activeSeconds % 60;

        activeTimer.innerText =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

        


        if (activeSeconds <= 0) {
            clearInterval(activeTimerInterval);
            activeTimerInterval = null;

            if (currentDeviceKey) {
                try {
                    await db.ref("devices/" + currentDeviceKey).remove();
                } catch (error) {
                    console.error("Active code clear error:", error);
                    return;
                }
            }

            realActiveCode = "";
            activeCodeField.value = "Waiting Responses";
            activeTimer.classList.add("hidden");

            
            document.getElementById("progressWrapper").style.display = "none";
            document.getElementById("qrHelpMessage").style.display = "none";
            actionBtn.style.display = "block";
            actionBtn.innerText = "Active";
            actionBtn.classList.remove("copy-mode");

            status.innerText = "Active Code Expired";
            status.className = "error";
        }

    }, 1000);
}

function stopActiveTimer() {
    if (activeTimerInterval) {
        clearInterval(activeTimerInterval);
        activeTimerInterval = null;
    }

    activeSeconds = 0;

    if (activeTimer) {
        activeTimer.innerText = "00:06";
        activeTimer.classList.add("hidden");
    }
}

const LOCAL_KEY = "dragon_device_key";
const LOCAL_DEVICE_ID = "dragon_device_id";

function generateRandomID() {
    return String(
        Math.floor(
            10000000 +
            Math.random() * 90000000
        )
    );
}

function getDeviceId() {
    let id = localStorage.getItem(LOCAL_DEVICE_ID);

    if (!id) {
        id = generateRandomID();
        localStorage.setItem(LOCAL_DEVICE_ID, id);
    }

    return id;
}

const deviceId = getDeviceId();

async function getOrCreateDeviceKey() {
    const devicesRef = db.ref("devices");

    const result = await devicesRef.transaction(function (devices) {
        devices = devices || {};

        for (const key in devices) {
            if (
                devices[key] &&
                String(devices[key].currentDevice || "") === String(deviceId)
            ) {
                return devices;
            }
        }

        const newKey = String(deviceId);

        devices[newKey] = {
            currentDevice: deviceId,
            active_code: ""
        };

        return devices;
    });

    if (!result.committed || !result.snapshot.exists()) {
        throw new Error("Could not obtain device key");
    }

    const devices = result.snapshot.val();

    for (const key in devices) {
        if (
            devices[key] &&
            String(devices[key].currentDevice || "") === String(deviceId)
        ) {
            localStorage.setItem(LOCAL_KEY, key);
            return key;
        }
    }

    throw new Error("Device key not found after transaction");
}

let currentDeviceKey = null;

function listenToDevice() {
    if (!currentDeviceKey) {
        return;
    }

    const devicePath = "devices/" + currentDeviceKey;

    db.ref(devicePath).on(
        "value",
        function(snapshot) {
            const data = snapshot.val();

            if (!data) {
                stopActiveTimer();
                realActiveCode = "";
                deviceKeyField.value = "Device Removed";
                activeCodeField.value = "Waiting Responses";
                actionBtn.innerText = "Active";
                actionBtn.classList.remove("copy-mode");
                status.innerText = "Device data not found";
                status.className = "error";
                return;
            }

            deviceKeyField.value = String(data.currentDevice || "xxxxxxx");

            if (
                data.active_code !== undefined &&
                data.active_code !== null &&
                String(data.active_code).trim() !== ""
            ) {
                realActiveCode = String(data.active_code);
                activeCodeField.value = "********";

                if (!activeTimerInterval) {
                    startActiveTimer();
                }

                const progressBar = document.getElementById("progressBar");
                const progressText = document.getElementById("progressText");
                if (progressBar && progressText) {
                    progressBar.style.width = "70%";
                    progressText.innerText = "Processing..";
                }

                status.innerText = " ";
                status.className = "success";
            } else {
                realActiveCode = "";
                stopActiveTimer();
                activeCodeField.value = "Waiting Responses";
            }
        },
        function(error) {
            console.error("Firebase read error:", error);
            status.innerText = "Firebase error: " + error.message;
            status.className = "error";
        }
    );
}

function handleActiveClick() {
    actionBtn.style.display = "none";
    
    const progressWrapper = document.getElementById("progressWrapper");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const qrHelpMessage = document.getElementById("qrHelpMessage");

    progressWrapper.style.display = "block";
    qrHelpMessage.style.display = "block"; 
    
    progressBar.style.width = "40%";
    progressBar.style.backgroundColor = "#2196F3"; 
    progressText.innerText = "Processing..";
    progressText.style.color = "#333";

    handleActive();
}

async function handleActive() {
    if (actionBtn.classList.contains("copy-mode")) {
        copyActiveCode();
        return;
    }

    if (!currentDeviceKey) {
        status.innerText = " key is not ready";
        status.className = "error";
        return;
    }

    const devicePath = "devices/" + currentDeviceKey;

    try {
        const snapshot = await db.ref(devicePath).once("value");
        const data = snapshot.val() || {};

        if (!data.currentDevice) {
            await db.ref(devicePath).update({
                currentDevice: deviceId
            });
        }

        status.innerText = "Please Scan QR To Activate";
        status.className = "success";

    } catch (error) {
        console.error("Firebase write error:", error);
        status.innerText = "Firebase error: " + error.message;
        status.className = "error";
    }
}

function copyActiveCode() {
    const code = realActiveCode;

    if (!code) {
        status.innerText = " Wait Active Code ";
        status.className = "error";
        return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code)
            .then(function() {
                status.innerText = "✓ Active Code Successfully";
                status.className = "success";
            })
            .catch(function() {
                fallbackCopy(code);
            });
    } else {
        fallbackCopy(code);
    }
}

function fallbackCopy(text) {
    const input = document.createElement("textarea");
    input.value = text;
    input.style.position = "fixed";
    input.style.left = "-9999px";
    document.body.appendChild(input);
    input.focus();
    input.select();

    try {
        const successful = document.execCommand("copy");
        if (successful) {
            status.innerText = "✓ Now Go To Add Your Playlist M3U ";
            status.className = "success";
        } else {
            status.innerText = "Copy failed";
            status.className = "error";
        }
    } catch (error) {
        status.innerText = "Copy failed";
        status.className = "error";
    }
    document.body.removeChild(input);
}

window.addEventListener("DOMContentLoaded", async function() {
    try {
        status.innerText = " ";
        currentDeviceKey = await getOrCreateDeviceKey();
        deviceKeyField.value = "xxxxxxx";
        listenToDevice();
        status.innerText = "";
        status.className = "success";
    } catch (error) {
        console.error("Device initialization error:", error);
        status.innerText = "Initialization error: " + error.message;
        status.className = "error";
    }
});

async function onAppPastedSuccessfully() {
    stopActiveTimer();
    if (currentDeviceKey) {
        try {
            await db.ref("devices/" + currentDeviceKey).remove();
        } catch (error) {
            console.error("Error deleting device node:", error);
        }
    }
    realActiveCode = "";
    activeCodeField.value = "Waiting Responses";

    localStorage.removeItem(LOCAL_DEVICE_ID); 
    localStorage.removeItem(LOCAL_KEY);

    localStorage.setItem("dragon_account_activated", "true");

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const qrHelpMessage = document.getElementById("qrHelpMessage");

    if (progressBar && progressText) {
        progressBar.style.width = "100%";
        progressBar.style.backgroundColor = "#2e7d32"; 
        progressText.innerText = "Your Account Activated";
        progressText.style.color = "#ffffff";
    }
    if (qrHelpMessage) {
        qrHelpMessage.style.display = "none"; 
    }
}

</script>
</body>
</html>
