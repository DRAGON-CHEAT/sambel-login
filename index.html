<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dragon Show</title>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #000;

            color: #fff;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 500px;

            background: #111;

            border: 1px solid #252525;

            border-radius: 14px;

            padding: 30px;

            box-shadow:
                0 5px 25px
                rgba(255,255,255,0.05);

            text-align: center;
        }


        h1 {

            margin: 0 0 28px 0;

            color: #ffcc00;

            font-size: 2.4rem;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        .input-group {

            margin-bottom: 20px;

            text-align: left;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #ccc;

            font-size: 15px;

            font-weight: 600;
        }


        input {

            width: 100%;

            height: 50px;

            padding: 10px 14px;

            border-radius: 7px;

            border: 1px solid #444;

            outline: none;

            background: #222;

            color: #00ffcc;

            font-size: 17px;

            font-weight: bold;

            text-align: center;

            user-select: none;
        }


        #actionBtn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 7px;

            background: #ffcc00;

            color: #000;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #actionBtn:active {

            transform: scale(0.98);
        }


        #actionBtn.copy-mode {

            background: #00ffcc;

            color: #000;
        }


        #status {

            margin-top: 18px;

            min-height: 22px;

            color: #aaa;

            font-size: 13px;
        }


        .success {

            color: #00ffcc !important;
        }


        .error {

            color: #ff5555 !important;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>DRAGON SHOW</h1>


    <!-- Device Key -->

    <div class="input-group">

        <label for="deviceKeyField">
            Device Key
        </label>

        <input
            type="text"
            id="deviceKeyField"
            value="Waiting for Device"
            readonly
        >

    </div>


    <!-- Active Code -->

    <div class="input-group">

        <label for="activeCodeField">
            Active Code
        </label>

        <input
            type="text"
            id="activeCodeField"
            value="Waiting for Firebase"
            readonly
        >

    </div>


    <!-- Active -->

    <button
        id="actionBtn"
        onclick="handleActive()"
    >
        Active
    </button>


    <div id="status">
        Connecting to Firebase...
    </div>


</div>



<script>


/*
|--------------------------------------------------------------------------
| Firebase
|--------------------------------------------------------------------------
*/

const firebaseConfig = {

    apiKey:
        "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",

    authDomain:
        "drag-9user.firebaseapp.com",

    databaseURL:
        "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "drag-9user",

    storageBucket:
        "drag-9user.firebasestorage.app",

    messagingSenderId:
        "716759119906",

    appId:
        "1:716759119906:web:4b522ed58dba7bf623727b"
};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.database();



/*
|--------------------------------------------------------------------------
| Path
|--------------------------------------------------------------------------
*/

const mainDevicePath =
    "devices/main";



/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const deviceKeyField =
    document.getElementById(
        "deviceKeyField"
    );


const activeCodeField =
    document.getElementById(
        "activeCodeField"
    );


const actionBtn =
    document.getElementById(
        "actionBtn"
    );


const status =
    document.getElementById(
        "status"
    );



/*
|--------------------------------------------------------------------------
| Generate Random Device ID
|--------------------------------------------------------------------------
|
| أرقام فقط.
|
| مثال:
|
| 58317426
|
| بدون -
|
| لا يحتوي على نفس الرقم الموجود حاليًا.
|
*/

function generateRandomID(existingId) {

    let id;


    do {

        /*
         * 8 أرقام عشوائية
         *
         * أول رقم لا يكون 0
         */

        id =
            String(
                Math.floor(
                    10000000 +
                    Math.random() *
                    90000000
                )
            );

    }

    while (
        existingId &&
        id === String(existingId)
    );


    return id;
}



/*
|--------------------------------------------------------------------------
| Read Firebase
|--------------------------------------------------------------------------
*/

function listenToMainDevice() {

    db.ref(mainDevicePath).on(
        "value",

        function(snapshot) {

            const data =
                snapshot.val();


            /*
             * لا توجد بيانات
             */

            if (!data) {

                deviceKeyField.value =
                    "Waiting for Device";


                activeCodeField.value =
                    "Waiting for Firebase";


                actionBtn.innerText =
                    "Active";


                actionBtn.classList.remove(
                    "copy-mode"
                );


                status.innerText =
                    "Ready to activate";


                status.className =
                    "";


                return;
            }



            /*
             *--------------------------------------------------
             * Device Key
             *--------------------------------------------------
             *
             * يقرأ نفس:
             *
             * devices/main/currentDevice
             */

            if (
                data.currentDevice !== undefined &&
                data.currentDevice !== null &&
                String(
                    data.currentDevice
                ).trim() !== ""
            ) {

                deviceKeyField.value =
                    String(
                        data.currentDevice
                    );


                /*
                 * صار موجود
                 */

                actionBtn.innerText =
                    "Copy Code";


                actionBtn.classList.add(
                    "copy-mode"
                );


                status.innerText =
                    "Device connected";


                status.className =
                    "success";

            } else {

                deviceKeyField.value =
                    "Waiting for Device";


                actionBtn.innerText =
                    "Active";


                actionBtn.classList.remove(
                    "copy-mode"
                );

            }



            /*
             *--------------------------------------------------
             * Active Code
             *--------------------------------------------------
             *
             * فقط قراءة من Firebase
             */

            if (
                data.active_code !== undefined &&
                data.active_code !== null &&
                String(
                    data.active_code
                ).trim() !== ""
            ) {

                activeCodeField.value =
                    String(
                        data.active_code
                    );

            } else {

                activeCodeField.value =
                    "Waiting for Firebase";
            }

        },

        function(error) {

            console.error(
                "Firebase read error:",
                error
            );


            status.innerText =
                "Firebase error: " +
                error.message;


            status.className =
                "error";
        }
    );
}



/*
|--------------------------------------------------------------------------
| Active Button
|--------------------------------------------------------------------------
*/

function handleActive() {


    /*
     * إذا كان الجهاز موجود
     * يصبح الزر Copy Code
     */

    if (
        actionBtn.classList.contains(
            "copy-mode"
        )
    ) {

        copyActiveCode();

        return;
    }



    /*
     * اقرأ البيانات الحالية أولاً
     */

    db.ref(mainDevicePath)
        .once("value")

        .then(function(snapshot) {


            const data =
                snapshot.val() || {};


            const existingId =
                data.currentDevice || "";



            /*
             * إنشاء ID عشوائي جديد
             *
             * بدون -
             */

            const newDeviceId =
                generateRandomID(
                    existingId
                );



            /*
             *--------------------------------------------------
             * إذا devices/main غير موجود
             *--------------------------------------------------
             *
             * ننشئ:
             *
             * currentDevice
             * active_code
             */

            if (!snapshot.exists()) {

                return db
                    .ref(mainDevicePath)
                    .set({

                        currentDevice:
                            newDeviceId,

                        active_code:
                            ""

                    });
            }



            /*
             *--------------------------------------------------
             * إذا المسار موجود لكن currentDevice فارغ
             *--------------------------------------------------
             */

            if (
                !existingId ||
                String(existingId).trim() === ""
            ) {

                return db
                    .ref(mainDevicePath)
                    .update({

                        currentDevice:
                            newDeviceId,

                        /*
                         * إذا active_code
                         * غير موجود، ننشئه فارغًا.
                         *
                         * إذا موجود، لا نمسحه.
                         */

                        ...(data.active_code === undefined
                            ? {
                                active_code: ""
                            }
                            : {})

                    });
            }



            /*
             * موجود مسبقاً
             */

            return null;

        })

        .then(function() {

            status.innerText =
                "Device registered successfully";


            status.className =
                "success";

        })

        .catch(function(error) {

            console.error(
                "Firebase write error:",
                error
            );


            status.innerText =
                "Firebase error: " +
                error.message;


            status.className =
                "error";
        });
}



/*
|--------------------------------------------------------------------------
| Copy Active Code
|--------------------------------------------------------------------------
*/

function copyActiveCode() {

    const code =
        activeCodeField.value;


    if (
        !code ||
        code === "Waiting for Firebase"
    ) {

        status.innerText =
            "Active Code is empty";


        status.className =
            "error";


        return;
    }



    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(code)

            .then(function() {

                status.innerText =
                    "Active Code copied";


                status.className =
                    "success";

            })

            .catch(function() {

                fallbackCopy(code);

            });

    } else {

        fallbackCopy(code);

    }
}



/*
|--------------------------------------------------------------------------
| Fallback Copy
|--------------------------------------------------------------------------
*/

function fallbackCopy(text) {

    const input =
        document.createElement(
            "textarea"
        );


    input.value =
        text;


    input.style.position =
        "fixed";


    input.style.left =
        "-9999px";


    document.body.appendChild(
        input
    );


    input.focus();

    input.select();


    try {

        document.execCommand(
            "copy"
        );


        status.innerText =
            "Active Code copied";


        status.className =
            "success";

    } catch (error) {

        status.innerText =
            "Copy failed";


        status.className =
            "error";
    }


    document.body.removeChild(
        input
    );
}



/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "DOMContentLoaded",

    function() {

        listenToMainDevice();

    }
);


</script>


</body>
</html>
