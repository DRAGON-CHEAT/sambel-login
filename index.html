<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dragon Show</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #222;
            -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
            color: #fff;
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            top: 0;
            bottom: 0;
            width: 28vw;
            max-width: 260px;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            left: 0;
            background: linear-gradient(
                to right,
                rgba(255, 0, 80, 0.32),
                rgba(0, 180, 255, 0.16) 40%,
                transparent 100%
            );
        }

        body::after {
            right: 0;
            background: linear-gradient(
                to left,
                rgba(0, 255, 180, 0.32),
                rgba(140, 0, 255, 0.16) 40%,
                transparent 100%
            );
        }

        

        .top-slots {
            display: flex;
            gap: 14px;
            width: 100%;
            margin: 0 0 28px 0;
        }

        .top-slot {
            flex: 1;
            aspect-ratio: 1 / 1;
            min-width: 0;
            border-radius: 10px;
            background: #222;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
        }

        .top-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 15px;
            font-weight: 600;
        }

        * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

        input {
            width: 100%;
            height: 50px;
            padding: 10px 14px;
            border-radius: 7px;
            border: 1px solid #444;
            outline: none;
            background: #222;
            color: #00ffcc;
            font-size: 17px;       
            user-select: none;
            font-weight: bold;
            text-align: center;
            user-select: none;
        }

        #actionBtn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 7px;
            background: #ffcc00;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #actionBtn:active {
            transform: scale(0.98);
        }

        #actionBtn.copy-mode {
            background: #00ffcc;
            color: #000;
        }

        #status {
            margin-top: 18px;
            min-height: 22px;
            width: 100%;
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }

        .success {
            color: #00ffcc !important;
        }

        .error {
            color: #ff5555 !important;
        }
        .active-code-wrapper {
    position: relative;
    width: 100%;
}

#activeCodeField {
    width: 100%;
    height: 50px;
    padding: 10px 14px;
    text-align: center;
}

#activeTimer {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);

    min-width: 48px;

    color: #ffcc00;
    font-size: 13px;
    font-weight: bold;

    text-align: center;

    pointer-events: none;
}

#activeTimer.hidden {
    display: none;
}

.active-code-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
}



#activeTimer {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);

    width: 45px;

    color: #ffcc00;
    font-size: 12px;
    font-weight: bold;

    text-align: center;

    pointer-events: none;
    z-index: 2;
}

#activeTimer.hidden {
    display: none;
}

#actionBtn {
    margin-top: 0;
}
.dragon-title {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);

    color: #8f2f4f;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;

    text-align: center;
    white-space: nowrap;

    z-index: 10;
}

    </style>

</head>

<body>
<div class="dragon-title">𝔻ℝ𝔸𝔾𝕆ℕ 𝕊ℍ𝕆𝕎</div>
<div class="container">

    <div class="top-slots">
        <a class="top-slot" href="https://t.me/Dev_DragonCheat" aria-label="QR Code">
            <img src="https://j.top4top.io/p_39276bu470.jpg" alt="QR Code">
        </a>

        <a class="top-slot" href="https://wa.me/qr/DPYQO5UBN27IB1" aria-label="Link">
            <img src="https://k.top4top.io/p_3927tljww2.jpg" alt="Link">
        </a>
    </div>

    <!-- Device Key -->

    <div class="input-group">

        <label for="deviceKeyField">
            Device Key
        </label>

        <input
            type="text"
            id="deviceKeyField"
            value="xxxxxxx"
            readonly
        >

    </div>


    <!-- Active Code -->

    <div class="input-group">

        <label for="activeCodeField">
            Active Code
        </label>

        <div class="active-code-wrapper">

    <span id="activeTimer">01:00</span>

    <input
        type="text"
        id="activeCodeField"
        value="Waiting ActiveCode"
        readonly
    >

</div>


    <!-- Active / Copy -->

    <button
        id="actionBtn"
        onclick="handleActive()"
    >
        Active
    </button>


    <div id="status">
        Connecting..
    </div>

</div>


<script>

/*
|--------------------------------------------------------------------------
| Firebase
|--------------------------------------------------------------------------
*/

const firebaseConfig = {

    apiKey:
        "AIzaSyCPVNySqB8Y21s_DJnn-jZFIb77UagAr4k",

    authDomain:
        "drag-9user.firebaseapp.com",

    databaseURL:
        "https://drag-9user-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "drag-9user",

    storageBucket:
        "drag-9user.firebasestorage.app",

    messagingSenderId:
        "716759119906",

    appId:
        "1:716759119906:web:4b522ed58dba7bf623727b"
};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();


/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const deviceKeyField =
    document.getElementById(
        "deviceKeyField"
    );

const activeCodeField =
    document.getElementById(
        "activeCodeField"
    );

const actionBtn =
    document.getElementById(
        "actionBtn"
    );

const status =
    document.getElementById(
        "status"
    );


/*
|--------------------------------------------------------------------------
| Active Code
|--------------------------------------------------------------------------
*/

let realActiveCode = "";


/*
|--------------------------------------------------------------------------
| Active Timer
|--------------------------------------------------------------------------
*/

const activeTimer =
    document.getElementById(
        "activeTimer"
    );

let activeTimerInterval = null;

let activeSeconds = 0;


/*
|--------------------------------------------------------------------------
| Start Active Timer
|--------------------------------------------------------------------------
*/

function startActiveTimer() {

    if (!activeTimer) {
        return;
    }

    /*
     * إيقاف المؤقت السابق
     */

    if (activeTimerInterval) {

        clearInterval(
            activeTimerInterval
        );

        activeTimerInterval = null;
    }


    /*
     * دقيقة كاملة
     */

    activeSeconds = 60;

    activeTimer.innerText =
        "01:00";

    activeTimer.classList.remove(
        "hidden"
    );


    activeTimerInterval =
        setInterval(async function() {

            activeSeconds--;


            const minutes =
                Math.floor(
                    activeSeconds / 60
                );

            const seconds =
                activeSeconds % 60;


            activeTimer.innerText =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");


            /*
             * انتهت الدقيقة
             */

            if (activeSeconds <= 0) {

                clearInterval(
                    activeTimerInterval
                );

                activeTimerInterval = null;


                /*
                 * حذف active_code فقط
                 *
                 * لا نلمس:
                 * currentDevice
                 * ولا أي بيانات أخرى
                 */

                if (currentDeviceKey) {

                    try {

                        await db
                            .ref(
                                "devices/" +
                                currentDeviceKey +
                                "/active_code"
                            )
                            .set("");

                    } catch (error) {

                        console.error(
                            "Active code clear error:",
                            error
                        );

                        return;
                    }
                }


                /*
                 * مسح الكود من الذاكرة
                 */

                realActiveCode = "";


                /*
                 * إعادة الحقل
                 */

                activeCodeField.value =
                    "Waiting Responses";


                /*
                 * إخفاء المؤقت
                 */

                activeTimer.classList.add(
                    "hidden"
                );


                /*
                 * إعادة الزر
                 */

                actionBtn.innerText =
                    "Active";

                actionBtn.classList.remove(
                    "copy-mode"
                );


                status.innerText =
                    "Active Code Expired";

                status.className =
                    "error";
            }

        }, 1000);
}


/*
|--------------------------------------------------------------------------
| Stop Active Timer
|--------------------------------------------------------------------------
*/

function stopActiveTimer() {

    if (activeTimerInterval) {

        clearInterval(
            activeTimerInterval
        );

        activeTimerInterval = null;
    }

    activeSeconds = 0;

    if (activeTimer) {

        activeTimer.innerText =
            "01:00";

        activeTimer.classList.add(
            "hidden"
        );
    }
}

/*
|--------------------------------------------------------------------------
| Local Storage Keys
|--------------------------------------------------------------------------
*/

const LOCAL_KEY =
    "dragon_device_key";

const LOCAL_DEVICE_ID =
    "dragon_device_id";


/*
|--------------------------------------------------------------------------
| Generate Device ID
|--------------------------------------------------------------------------
*/

function generateRandomID() {

    return String(
        Math.floor(
            10000000 +
            Math.random() * 90000000
        )
    );
}


/*
|--------------------------------------------------------------------------
| Get Device ID
|--------------------------------------------------------------------------
*/

function getDeviceId() {

    let id =
        localStorage.getItem(
            LOCAL_DEVICE_ID
        );

    if (!id) {

        id =
            generateRandomID();

        localStorage.setItem(
            LOCAL_DEVICE_ID,
            id
        );
    }

    return id;
}


const deviceId =
    getDeviceId();


/*
|--------------------------------------------------------------------------
| Find Free Key
|--------------------------------------------------------------------------
*/

async function findFreeKey() {

    let number = 1;

    while (true) {

        const key =
            "key" + number;

        const snapshot =
            await db
                .ref(
                    "devices/" + key
                )
                .once("value");

        if (!snapshot.exists()) {

            return key;
        }

        number++;
    }
}


/*
|--------------------------------------------------------------------------
| Get Or Create Device Key
|--------------------------------------------------------------------------
*/

async function getOrCreateDeviceKey() {

    const savedKey =
        localStorage.getItem(
            LOCAL_KEY
        );

    if (savedKey) {

        const snapshot =
            await db
                .ref(
                    "devices/" + savedKey
                )
                .once("value");

        if (snapshot.exists()) {

            return savedKey;
        }

        localStorage.removeItem(
            LOCAL_KEY
        );
    }


    const newKey =
        await findFreeKey();


    await db
        .ref(
            "devices/" + newKey
        )
        .set({

            currentDevice:
                deviceId,

            active_code:
                ""

        });


    localStorage.setItem(
        LOCAL_KEY,
        newKey
    );


    return newKey;
}


/*
|--------------------------------------------------------------------------
| Current Device Key
|--------------------------------------------------------------------------
*/

let currentDeviceKey =
    null;

/*
|--------------------------------------------------------------------------
| Listen To Device
|--------------------------------------------------------------------------
*/

function listenToDevice() {

    if (!currentDeviceKey) {
        return;
    }


    const devicePath =
        "devices/" +
        currentDeviceKey;


    db.ref(devicePath).on(
        "value",

        function(snapshot) {

            const data =
                snapshot.val();


            /*
             * إذا تم حذف الجهاز
             */

            if (!data) {

                stopActiveTimer();

                realActiveCode =
                    "";


                deviceKeyField.value =
                    "Device Removed";


                activeCodeField.value =
                    "Waiting Responses";


                actionBtn.innerText =
                    "Active";


                actionBtn.classList.remove(
                    "copy-mode"
                );


                status.innerText =
                    "Device data not found";


                status.className =
                    "error";


                return;
            }


            /*
             * Device Key
             */

            deviceKeyField.value =
                String(
                    data.currentDevice ||
                    "xxxxxxx"
                );


            /*
             * Active Code
             */

            if (
                data.active_code !== undefined &&
                data.active_code !== null &&
                String(
                    data.active_code
                ).trim() !== ""
            ) {

                /*
                 * حفظ الكود الحقيقي
                 */

  realActiveCode =
    String(data.active_code);

activeCodeField.value =
    "********";


/*
 * تشغيل المؤقت فقط إذا لم يكن شغالًا
 */

if (
    !activeTimerInterval
) {

    startActiveTimer();
}

                /*
                 * زر Copy
                 */

                actionBtn.innerText =
                    "Copy Code";


                actionBtn.classList.add(
                    "copy-mode"
                );


                status.innerText =
                    " ";


                status.className =
                    "success";


            } else {

                /*
                 * لا يوجد Active Code
                 */

                realActiveCode =
                    "";


                stopActiveTimer();


                activeCodeField.value =
                    "Waiting Responses";


                actionBtn.innerText =
                    "Active";


                actionBtn.classList.remove(
                    "copy-mode"
                );


                status.innerText =
                    "Click Button To Active ";


                status.className =
                    "";
            }

        },


        function(error) {

            console.error(
                "Firebase read error:",
                error
            );


            status.innerText =
                "Firebase error: " +
                error.message;


            status.className =
                "error";
        }
    );
}


/*
|--------------------------------------------------------------------------
| Active Button
|--------------------------------------------------------------------------
*/

async function handleActive() {

    /*
     * إذا صار Copy Code
     */

    if (
        actionBtn.classList.contains(
            "copy-mode"
        )
    ) {

        copyActiveCode();

        return;
    }


    /*
     * إذا ما عندنا key
     */

    if (!currentDeviceKey) {

        status.innerText =
            " key is not ready";


        status.className =
            "error";


        return;
    }


    /*
     * قراءة بيانات الجهاز
     */

    const devicePath =
        "devices/" +
        currentDeviceKey;


    try {

        const snapshot =
            await db
                .ref(devicePath)
                .once("value");


        const data =
            snapshot.val() || {};


        /*
         * إذا currentDevice غير موجود
         */

        if (
            !data.currentDevice
        ) {

            await db
                .ref(devicePath)
                .update({

                    currentDevice:
                        deviceId

                });
        }


        status.innerText =
            "Please Scan QR To Activate";


        status.className =
            "success";


    } catch (error) {

        console.error(
            "Firebase write error:",
            error
        );


        status.innerText =
            "Firebase error: " +
            error.message;


        status.className =
            "error";
    }
}


/*
|--------------------------------------------------------------------------
| Copy Active Code
|--------------------------------------------------------------------------
*/

function copyActiveCode() {

    /*
     * استخدام الكود الحقيقي
     * وليس النجوم
     */

    const code =
        realActiveCode;


    /*
     * لا يوجد كود
     */

    if (!code) {

        status.innerText =
            " Wait Active Code ";


        status.className =
            "error";


        return;
    }


    /*
     * Clipboard API
     */

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(code)

            .then(function() {

                status.innerText =
                    "✓ Active Code Successfully";


                status.className =
                    "success";

            })

            .catch(function() {

                fallbackCopy(code);

            });

    } else {

        fallbackCopy(code);
    }
}


/*
|--------------------------------------------------------------------------
| Fallback Copy
|--------------------------------------------------------------------------
*/

function fallbackCopy(text) {

    const input =
        document.createElement(
            "textarea"
        );


    input.value =
        text;


    input.style.position =
        "fixed";


    input.style.left =
        "-9999px";


    document.body.appendChild(
        input
    );


    input.focus();

    input.select();


    try {

        const successful =
            document.execCommand(
                "copy"
            );


        if (successful) {

            status.innerText =
                "✓ Now Go To add Pleylist M3u ";


            status.className =
                "success";

        } else {

            status.innerText =
                "Copy failed";


            status.className =
                "error";
        }

    } catch (error) {

        status.innerText =
            "Copy failed";


        status.className =
            "error";
    }


    document.body.removeChild(
        input
    );
}


/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "DOMContentLoaded",

    async function() {

        try {

            status.innerText =
                " ";


            /*
             * الحصول على key
             */

            currentDeviceKey =
                await getOrCreateDeviceKey();


            /*
             * إخفاء Device ID
             */

            deviceKeyField.value =
                "xxxxxxx";


            /*
             * تشغيل الاستماع
             */

            listenToDevice();


            status.innerText =
                "";


            status.className =
                "success";


        } catch (error) {

            console.error(
                "Device initialization error:",
                error
            );


            status.innerText =
                "Initialization error: " +
                error.message;


            status.className =
                "error";
        }

    });

</script>
</body>
</html>
