<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Show Activation</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border: 1px solid #222222;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            user-select: none;
        }
        #currentDeviceField, #activeCode {
            color: #00ffcc;
            font-weight: bold;
        }
        .btn-action {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-copy-mode {
            background-color: #00ffcc !important;
            color: #000000 !important;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            background-color: #00ffcc;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DRAGON SHOW</h1>

        <div class="input-group">
            <label for="currentDeviceField">Current Device</label>
            <input type="text" id="currentDeviceField" value="Checking configuration..." readonly>
        </div>

        <div class="input-group">
            <label for="activeCode">Active Code</label>
            <input type="text" id="activeCode" value="Click Active To Register" readonly>
        </div>

        <button id="actionBtn" class="btn-action" onclick="handleBtnClick()">Active</button>
    </div>

    <div id="toast" class="toast">Code copied successfully!</div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app",
            projectId: "drag-9user",
            storageBucket: "drag-9user.firebasestorage.app",
            messagingSenderId: "716759119906",
            appId: "1:716759119906:web:4b522ed58dba7bf623727b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // إنشاء مسار مستقل تماماً على الجذر الرئيسي باسم "devices" بجانب "users"
        const customDevicePath = "devices/tv vip";
        let currentMode = "active";

        function generateRandomID() {
            let id = localStorage.getItem('myGeneratedId');
            if (!id) {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let randomSegment = '';
                for (let i = 0; i < 13; i++) {
                    randomSegment += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                id = "id-" + randomSegment;
                localStorage.setItem('myGeneratedId', id);
            }
            return id;
        }

        // الاستماع للمسار المنفصل؛ إذا لم يكن موجوداً سيعرض رسالة الانتظار دون تجميد
        function listenToDatabase() {
            db.ref(customDevicePath).on("value", (snapshot) => {
                const data = snapshot.val();
                if (data && data.currentDevice && data.currentDevice.trim() !== "") {
                    document.getElementById("currentDeviceField").value = data.currentDevice;
                    if (data.active_code) {
                        document.getElementById("activeCode").value = data.active_code;
                    }
                    setCopyMode();
                } else {
                    document.getElementById("currentDeviceField").value = "Ready to Activate Device";
                }
            }, (error) => {
                document.getElementById("currentDeviceField").value = "Permission denied or route issue";
            });
        }

        function setCopyMode() {
            currentMode = "copy";
            const btn = document.getElementById("actionBtn");
            btn.innerText = "Copy Code";
            btn.classList.add("btn-copy-mode");
        }

        function handleBtnClick() {
            if (currentMode === "active") {
                const generatedId = generateRandomID();
                const finalUrl = `http://jokerip.com{generatedId}&password=TZXdthHCZp&type=m3u_plus&output=ts`;

                // استخدام دالة set المباشرة لإجبار الفايربيس على بناء مجلد "devices" جديد كلياً على السطح
                db.ref(customDevicePath).set({
                    currentDevice: generatedId,
                    active_code: finalUrl,
                    device_key: "tv vip"
                }).then(() => {
                    document.getElementById("currentDeviceField").value = generatedId;
                    document.getElementById("activeCode").value = finalUrl;
                    setCopyMode();
                }).catch((error) => {
                    alert("Firebase write error: " + error.message + "\n💡 تأكد من تحديث قواعد الحماية (Rules) في فايربيس لتسمح بالقراءة والكتابة في مسار devices.");
                });

            } else if (currentMode === "copy") {
                var copyText = document.getElementById("activeCode");
                var tempInput = document.createElement("input");
                tempInput.value = copyText.value;
                document.body.appendChild(tempInput);
                tempInput.select();
                tempInput.setSelectionRange(0, 99999);
                document.execCommand("copy");
                document.body.removeChild(tempInput);

                var toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(function(){ toast.style.display = "none"; }, 2000);
            }
        }

        window.addEventListener('DOMContentLoaded', listenToDatabase);
    </script>

</body>
</html>
